<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil - Tinder Clone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f5f5f5;
        }

        header {
            background-color: white;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        header .content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
            color: #667eea;
        }

        header nav {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        header nav button {
            background-color: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background-color 0.3s;
        }

        header nav button:hover {
            background-color: #5568d3;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .user-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .info-item {
            padding: 15px;
            background-color: #f9f9f9;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .info-item strong {
            color: #667eea;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 16px;
            height: 16px;
            margin-left: 8px;
            border: 2px solid #667eea;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Script de protection : à inclure AVANT tout autre contenu -->
    <script src="js/auth-guard.js"></script>

    <header>
        <div class="content">
            <h1>🔥 Tinder Clone</h1>
            <nav>
                <span id="userGreeting" style="color: #999;"></span>
                <button onclick="logout()">Déconnexion</button>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <h2>Bienvenue !</h2>
            <div id="userContent" class="loading">Chargement des informations...</div>
        </div>
    </div>

    <script>
        // Écouter l'événement de chargement utilisateur
        window.addEventListener('userLoaded', (e) => {
            const user = e.detail;
            const greeting = document.getElementById('userGreeting');
            const content = document.getElementById('userContent');

            greeting.textContent = `Bonjour, ${user.prenomUser || 'Utilisateur'} !`;

            let html = '<div class="user-info">';
            html += `<div class="info-item"><strong>Prénom :</strong> ${user.prenomUser}</div>`;
            html += `<div class="info-item"><strong>Nom :</strong> ${user.nomEUser}</div>`;
            html += `<div class="info-item"><strong>Email :</strong> ${user.emailUser}</div>`;
            html += `<div class="info-item"><strong>Âge :</strong> ${user.age}</div>`;
            if (user.photo) {
                html += `<div class="info-item"><strong>Photo :</strong> ${user.photo}</div>`;
            }
            if (user.biographie) {
                html += `<div class="info-item"><strong>Biographie :</strong> ${user.biographie}</div>`;
            }
            html += '</div>';

            content.innerHTML = html;
        });
    </script>
</body>
</html>
